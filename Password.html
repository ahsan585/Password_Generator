<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A modern, secure, and customizable password generator with real-time strength meter.">
    <title>Secure Password Generator</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Password.css">
</head>
<body>
    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <main class="container">
        <header class="header">
            <div class="header-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            <h1>Password Generator</h1>
            <p class="subtitle">Create strong and secure passwords to keep your accounts safe.</p>
        </header>

        <!-- Password Display Section -->
        <section class="password-area">
            <div class="input-wrapper">
                <input type="text" id="password" readonly placeholder="Click Generate" aria-label="Generated Password">
                <div class="display-actions">
                    <button id="refresh" class="icon-btn" title="Regenerate" aria-label="Regenerate password">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
                        </svg>
                    </button>
                    <button id="copy" class="action-btn copy-btn" title="Copy to clipboard" aria-label="Copy password">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                        <span id="copyText">Copy</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- Strength Meter -->
        <section class="strength-container" id="strengthContainer">
            <div class="strength-header">
                <span class="label">Strength:</span>
                <span id="strengthText" class="strength-text">Medium</span>
            </div>
            <div class="strength-bar-track">
                <div id="strengthBar" class="strength-bar-fill"></div>
            </div>
        </section>

        <!-- Configuration Options -->
        <section class="settings">
            <!-- Length Slider -->
            <div class="slider-group">
                <div class="slider-header">
                    <label for="lengthSlider">Password Length</label>
                    <span id="lengthValue" class="length-badge">16</span>
                </div>
                <input type="range" id="lengthSlider" min="6" max="32" value="16" step="1">
            </div>

            <!-- Options Switches -->
            <div class="options-grid">
                <label class="custom-checkbox" for="uppercase">
                    <input type="checkbox" id="uppercase" checked>
                    <span class="checkmark"></span>
                    <span class="option-label">
                        <span class="primary">Uppercase</span>
                        <span class="hint">A-Z</span>
                    </span>
                </label>

                <label class="custom-checkbox" for="lowercase">
                    <input type="checkbox" id="lowercase" checked>
                    <span class="checkmark"></span>
                    <span class="option-label">
                        <span class="primary">Lowercase</span>
                        <span class="hint">a-z</span>
                    </span>
                </label>

                <label class="custom-checkbox" for="numbers">
                    <input type="checkbox" id="numbers" checked>
                    <span class="checkmark"></span>
                    <span class="option-label">
                        <span class="primary">Numbers</span>
                        <span class="hint">0-9</span>
                    </span>
                </label>

                <label class="custom-checkbox" for="symbols">
                    <input type="checkbox" id="symbols" checked>
                    <span class="checkmark"></span>
                    <span class="option-label">
                        <span class="primary">Symbols</span>
                        <span class="hint">!@#$%^&*</span>
                    </span>
                </label>
            </div>
        </section>

        <!-- Generate Button -->
        <button id="generate" class="generate-btn">
            <span>Generate Password</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
        </button>

        <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </main>

    <script src="Password.js"></script>
</body>
</html>
